name: release

# Cut a release with `task release -- <version>`. Pushing the tag runs this,
# which reuses the same task targets you'd run by hand — no duplicated logic.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', registry-url: 'https://registry.npmjs.org' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: arduino/setup-task@v2
        with: { repo-token: '${{ secrets.GITHUB_TOKEN }}' }

      - name: Tag matches package.json
        run: |
          PKG="v$(task version)"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG)"; exit 1
          fi

      - name: Test
        run: |
          npm install --prefix scripts --silent
          task test

      - name: Publish the GitHub release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            && echo "release $TAG already exists" \
            || gh release create "$TAG" --title "ReClaude ${TAG#v}" --generate-notes
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - name: Update the Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        run: task release:tap -- "$TAG"
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com

      - name: Tap not updated
        if: ${{ env.TAP_TOKEN == '' }}
        run: echo "::warning::TAP_TOKEN secret is not set — skipping the tap bump. Run 'task release:tap -- $TAG' locally."
        env: { TAP_TOKEN: '${{ secrets.TAP_TOKEN }}' }

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: npm not published
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN secret is not set — skipping npm publish."
        env: { NPM_TOKEN: '${{ secrets.NPM_TOKEN }}' }
