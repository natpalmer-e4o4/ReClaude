name: reclaude

services:
  reclaude:
    build: .
    container_name: reclaude
    # Loopback only: transcripts contain real project data and secrets.
    ports:
      - "127.0.0.1:7331:7331"
    environment:
      HOST_PROJECTS: /host-projects
      FILE_HISTORY: /host-file-history
      # cap on the mirrored backup cache; oldest files evicted first. 0/unset = unlimited.
      FH_CACHE_MAX_MB: "10240"
      # in-memory redacted build-session demo; override with: DEMO_SEED=1 task up
      DEMO_SEED: "${DEMO_SEED:-0}"
    volumes:
      - reclaude-data:/data
      - ${HOME}/.claude/projects:/host-projects:ro
      - ${HOME}/.claude/file-history:/host-file-history:ro
    restart: unless-stopped

volumes:
  reclaude-data:
    # Pinned to the pre-rename physical volume: the compose project name no longer
    # derives from the folder, so renaming the directory cannot orphan this data.
    name: contextexplorer_context-explorer-data
